<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }
        :root {
            /* 自定义图片路径，后期替换图标只需改这里 */
            --logo-img: "./icon/logo.png";
            --qq-img: "./icon/qq.png";
            --server-img: "./icon/server.png";
            --world-img: "./icon/world.png";
            --plugin-img: "./icon/plugin.png";
            --search-img: "./icon/search.png";
            --download-img: "./icon/download.png";
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --main-blue: #3b82f6;
            --light-blue: #60a5fa;
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
            --transition: all 0.3s ease;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            overflow-x: hidden;
            min-height: 100vh;
        }
        /* 导航栏 */
        header {
            width: 100%;
            height: 70px;
            background-color: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 2px 12px rgba(59, 130, 246, 0.2);
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--main-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            transition: var(--transition);
        }
        .logo-icon:hover {
            transform: rotate(15deg) scale(1.1);
        }
        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--main-blue);
        }
        .nav-list {
            display: flex;
            gap: 24px;
            list-style: none;
        }
        .nav-item a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: var(--transition);
            position: relative;
        }
        .nav-item a:hover {
            color: var(--text-white);
            background-color: rgba(59, 130, 246, 0.2);
        }
        .nav-item a::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: var(--main-blue);
            transition: var(--transition);
        }
        .nav-item a:hover::after {
            width: 80%;
        }
        /* 通用按钮样式 全套动态反馈 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            transform: translateY(0);
        }
        .btn-primary {
            background-color: var(--main-blue);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--light-blue);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.2);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--main-blue);
            color: var(--main-blue);
        }
        .btn-outline:hover {
            background-color: rgba(59, 130, 246, 0.15);
            transform: translateY(-3px);
        }
        .btn-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
