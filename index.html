<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoland - The Oldest Anarchy Server in China</title>
    <style>
        /* === Global Reset & Base Styles === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #333333; /* Classic Dark Grey Background */
            color: #dddddd;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* === Main Container === */
        .container {
            width: 100%;
            max-width: 900px;
            background-color: #444444; /* Slightly lighter grey for the main block */
            padding: 20px;
            margin: 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* === Header / Logo Area === */
        header {
            text-align: center;
            padding: 40px 0 20px 0;
            border-bottom: 2px solid #222;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            font-size: 1rem;
            font-weight: bold;
        }

        /* === Navigation / Action Buttons === */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #222;
            padding: 10px 20px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .menu-btn {
            font-size: 1.2rem;
            cursor: pointer;
            color: #fff;
        }

        .shop-link {
            background-color: #666;
            color: #fff;
            padding: 8px 15px;
            border-radius: 3px;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .shop-link:hover {
            background-color: #888;
        }

        /* === Content Sections === */
        .section {
            background-color: #3a3a3a;
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 4px;
            border-left: 5px solid #555;
        }

        .section h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
        }

        .highlight-green {
            color: #5cb85c; /* Bootstrap success green */
            font-weight: bold;
        }

        .highlight-red {
            color: #d9534f; /* Bootstrap danger red */
            font-weight: bold;
        }

        p {
            margin-bottom: 15px;
            color: #ccc;
        }

        ul {
            margin-left: 20px;
            margin-bottom: 15px;
            color: #ccc;
        }

        li {
            margin-bottom: 5px;
        }

        /* === Call to Action (Join IP) === */
        .cta-box {
            text-align: center;
            background-color: #2a2a2a;
            padding: 40px;
            border: 2px dashed #555;
            margin-top: 20px;
        }

        .server-ip {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            color: #fff;
            background: #000;
            padding: 10px 20px;
            display: inline-block;
            margin: 15px 0;
            border-radius: 4px;
            user-select: all; /* Makes it easy to copy */
        }

        .join-btn {
            display: inline-block;
            background-color: #5cb85c;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 10px;
            transition: transform 0.1s;
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        /* === Map Embed === */
        .map-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            border: 1px solid #555;
            margin-top: 10px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* === Footer === */
        footer {
            text-align: center;
            padding: 40px 0;
            color: #777;
            font-size: 0.8rem;
            border-top: 1px solid #444;
            margin-top: 40px;
        }
